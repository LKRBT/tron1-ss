#机器人几何参，如果机器人是圆形，设置 robot_radius,如果是其他形状设置 footprint
# TODO : 0.25 ~ 0.35
# 값이 높을수록 장애물을 잘 회피하나 부딪힐 확률도 높아진다.
# robot_radius: 0.4 #圆形
# robot_radius: 0.25 #圆形
robot_radius: 0.35 #圆形
# footprint: [[-0.369, -0.25], [-0.369, 0.25], [0.369, 0.25], [0.369, -0.25]] #其他形状
# footprint: [[-0.519, -0.45], [-0.519, 0.45], [0.519, 0.45], [0.519, -0.45]] #其他形状

#地图类型
map_type: costmap

# 25.09.29 [STVL-LiDAR]
lidar_obstacle_layer:
  enabled:                  true
  # voxel_decay:              15    # seconds if linear, e^n if exponential
  voxel_decay:              5    # seconds if linear, e^n if exponential
  decay_model:              0     # 0=linear, 1=exponential, -1=persistent
  voxel_size:               0.05  # meters
  track_unknown_space:      true  # default space is known
  # max_obstacle_height:      2.0   # meters
  max_obstacle_height:      1.0   # meters
  unknown_threshold:        15    # voxel height
  mark_threshold:           0     # voxel height
  update_footprint_enabled: true
  combination_method:       1     # 1=max, 0=override
  # obstacle_range:           3.0   # meters
  obstacle_range:           4.5   # meters
  origin_z:                 0.0   # meters
  # publish_voxel_map:        false # default off
  publish_voxel_map:        true # default off
  transform_tolerance:      0.2   # seconds
  mapping_mode:             false # default off, saves map not for navigation
  map_save_duration:        60    # default 60s, how often to autosave
  observation_sources:      lidar1_mark lidar1_clear

  lidar1_mark:
    data_type: PointCloud2
    topic: /livox/lidar_filter1
    marking: true
    clearing: false
    # min_obstacle_height: 0.3     # default 0, meters
    min_obstacle_height: 0.0     # default 0, meters
    # max_obstacle_height: 2.0     # default 3, meters
    max_obstacle_height: 1.0     # default 3, meters
    expected_update_rate: 0.0    # default 0, if not updating at this rate at least, remove from buffer
    observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
    inf_is_valid: false          # default false, for laser scans
    clear_after_reading: true    # default false, clear the buffer after the layer gets readings from it
    filter: "voxel"              # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on
    voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
  
  lidar1_clear:
    enabled: true                #default true, can be toggled on/off with associated service call
    data_type: PointCloud2
    topic: /livox/lidar_filter1
    marking: false
    clearing: true
    # min_z: 1.0                  # default 10, meters
    min_z: 0.5                  # default 10, meters
    # max_z: 8.0                  # default 0, meters
    max_z: 4.5                  # default 0, meters
    vertical_fov_angle: 0.523   # default 0.7, radians. For 3D lidars it's the symmetric FOV about the planar axis.
    vertical_fov_padding: 0.05    # 3D Lidar only. Default 0, in meters 
    horizontal_fov_angle: 6.29  # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.
    decay_acceleration: 5.0     # default 0, 1/s^2. 
    model_type: 1               # default 0, model type for frustum. 0=depth camera, 1=3d lidar like VLP16 or similar

# 25.09.29 [STVL-RGBD]
rgbd_obstacle_layer:
  enabled:               true
  voxel_decay:           15     #seconds if linear, e^n if exponential
  decay_model:           0      #0=linear, 1=exponential, -1=persistent
  voxel_size:            0.05   #meters
  track_unknown_space:   true   #default space is unknown
  observation_persistence: 0.0  #seconds
  # 0.3~0.4
  # max_obstacle_height:   0.3    #meters
  # max_obstacle_height:   0.4    #meters
  max_obstacle_height:   0.35    #meters
  # unknown_threshold:     15     #voxel height
  unknown_threshold:     3     #voxel height
  mark_threshold:        3      #voxel height
  update_footprint_enabled: true
  combination_method:    1      #1=max, 0=override
  # obstacle_range:        2.5    #meters
  obstacle_range:       1.5    #meters
  origin_z:              0.0    #meters
  publish_voxel_map:     true   # default off
  transform_tolerance:   0.2    # seconds
  mapping_mode:          false  # default off, saves map not for navigation
  map_save_duration:     60     #default 60s, how often to autosave
  observation_sources:   rgbd1_clear rgbd1_mark

  rgbd1_mark:
    data_type: PointCloud2
    topic: /camera/depth/color/points
    marking: true
    clearing: false
    # 0.1~0.2
    # min_obstacle_height: 0.2     #default 0, meters
    # min_obstacle_height: 0.1     #default 0, meters
    min_obstacle_height: 0.15     #default 0, meters
    # 0.3~0.4
    # max_obstacle_height: 0.3     #defaule 3, meters
    # max_obstacle_height: 0.4     #defaule 3, meters
    max_obstacle_height: 0.35     #defaule 3, meters
    expected_update_rate: 0.0    #default 0, if not updating at this rate at least, remove from buffer
    observation_persistence: 0.0 #default 0, use all measurements taken during now-value, 0=latest 
    inf_is_valid: false          #default false, for laser scans
    clear_after_reading: true    #default false, clear the buffer after the layer gets readings from it
    filter: "voxel"              #default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommended to have at one filter on
    voxel_min_points: 10          #default 0, minimum points per voxel for voxel filter

  # RGBD 카메라에서 clear 모드는 사용하면 안됨.
  # rgbd1_clear:
  #   enabled: true                #default true, can be toggled on/off with associated service call
  #   data_type: PointCloud2
  #   topic: /camera/depth/color/points
  #   marking: false
  #   clearing: true
  #   # min_z: 0.1                   #default 0, meters
  #   min_z: 0.3                   #default 0, meters
  #   # max_z: 2.5                   #default 10, meters
  #   max_z: 1.5                   #default 10, meters
  #   # vertical_fov_angle: 0.7      #default 0.7, radians
  #   vertical_fov_angle:   1.01   # 58° = 1.01 rad
  #   # horizontal_fov_angle: 1.04   #default 1.04, radians
  #   horizontal_fov_angle: 1.52   # 87° = 1.52 rad
  #   decay_acceleration: 1.       #default 0, 1/s^2. If laser scanner MUST be 0
  #   model_type: 0                #default 0 (depth camera). Use 1 for 3D Lidar
