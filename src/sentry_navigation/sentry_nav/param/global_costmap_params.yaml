  #     max_obstacle_height: 0.5

    # livox_data:
    #   data_type: PointCloud2
    #   topic:  /livox/lidar_filter #/livox/lidar
    #   marking: true
    #   clearing: true
    #   # TODO : 사용시, 라이다 설치 방향에 따라서 반대로 설정하는 것 검토 필요
    #   min_obstacle_height: 0.3
    #   max_obstacle_height: 0.5

  inflation_layer:
    enabled: true

    #膨胀半径，扩展在碰撞区域以外的代价区域，使得机器人规划路径避开障碍物
    # TODO : 0.1 ~ 0.25
    inflation_radius: 0.2 # fix

    #代价比例系数，越大则代价值越小
    cost_scaling_factor: 10.0 # fix
