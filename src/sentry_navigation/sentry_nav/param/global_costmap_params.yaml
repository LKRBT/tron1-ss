global_costmap:
  global_frame: map #地图坐标系
  robot_base_frame: body #机器人坐标系 # default : base_link
  # 以此实现坐标变换
 
  update_frequency: 5 #代价地图更新频率
  # update_frequency: 10 #代价地图更新频率
  publish_frequency: 5 #代价地图的发布频率
  # publish_frequency: 10 #代价地图的发布频率
  transform_tolerance: 2 #等待坐标变换发布信息的超时时间
 
  static_map: true # 是否使用一个地图或者地图服务器来初始化全局代价地图，如果不使用静态地图，这个参数为false.
  rolling_window: false
  resolution: 0.05
  map_type: costmap
  
  #################################################################################
  
  plugins:
  - {name: static_layer,        type: "costmap_2d::StaticLayer"}
  - {name: obstacle_layer,      type: "costmap_2d::ObstacleLayer"}
  # - {name: voxel_layer,         type: "costmap_2d::VoxelLayer"}
  - {name: inflation_layer,     type: "costmap_2d::InflationLayer"}

  static_layer:
    enabled: true

  obstacle_layer:
    enabled: true
    obstacle_range: 4.0 # 用于障碍物探测，比如: 值为 3.0，意味着检测到距离小于 3 米的障碍物时，就会引入代价地图
    raytrace_range: 4.5 # 用于清除障碍物，比如：值为 3.5，意味着清除代价地图中 3.5 米以外的障碍物

    observation_sources: scan
    # observation_sources: scan scan_depth
    scan:
      data_type: LaserScan 
      topic: /scan_cloud 
      marking: true 
      clearing: true
      sensor_frame: body
      # observation_persistence: 0.0

    # # Realsense 설정 : Pointcloud2laser
    # scan_depth:
    #   data_type: LaserScan
    #   topic: /scan_depth
    #   # topic: /scan_filtered
    #   marking: true
    #   clearing: true
    #   sensor_frame: body
    #   # observation_persistence: 0.0

  # voxel_layer:
  #   # global_frame 기준 파라미터들 (sensor_frame X)
  #   origin_z: 0.0 # 전역 프레임의 바닥 높이 z
  #   z_resolution: 0.05 # z 방향 voxel 크기 (5cm 단위)
  #   z_voxels: 12 # 총 높이 커버: 0.05 * 12 = 0.6m로 0.0 ~ 0.6m 관찰
  #   # min_obstacle_height: 0.05 # 최소 장애물 높이 필터링
  #   # max_obstacle_height: 0.5 # 최대 장애물 높이 필터링

  #   unknown_threshold: 0        # voxel이 몇 개 이상 비어 있으면 clearing 허용
  #   mark_threshold: 4            # voxel이 몇 개 이상 채워지면 mark # fix
  #   publish_voxel_map: true     # rviz 시각화용. 필요하면 true
  #   # 여러 센서 데이터가 같은 costmap cell을 업데이트할 때 방법
  #   # 1 설정 시, 기존 값과 새 값 중 더 큰 값 사용 → 충돌 방지, 안정적
  #   combination_method: 1        # 0: overwrite, 1: max (기본값 추천)

  #   observation_sources: depth
  #   depth:
  #     data_type: PointCloud2
  #     topic: /camera/depth/color/points
  #     marking: true
  #     clearing: true
  #     sensor_frame: body
  #     observation_persistence: 0.0
