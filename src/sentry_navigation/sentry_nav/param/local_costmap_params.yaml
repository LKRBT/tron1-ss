local_costmap:
  # TODO : 전역 프레임 설정
  global_frame: robot_foot_init #里程计坐标系
  # global_frame: map #里程计坐标系
  robot_base_frame: body #机器人坐标系 # default : base_link
 
  update_frequency: 10 #代价地图更新频率
  publish_frequency: 10 # fix #代价地图的发布频率
  transform_tolerance: 2 #等待坐标变换发布信息的超时时间
 
  # 25.10.14
  # static_map: false  #不需要静态地图，可以提升导航效果
  static_map: true  #不需要静态地图，可以提升导航效果

  rolling_window: true #是否使用动态窗口，默认为false，在静态的全局地图中，地图不会变化
  width: 12 # 局部地图宽度 单位是 m
  height: 12 # 局部地图高度 单位是 m
  resolution: 0.05 # 局部地图分辨率 单位是 m，一般与静态地图分辨率保持一致

  #################################################################################
  
  plugins:
  # - {name: static_layer,        type: "costmap_2d::StaticLayer"}
  - {name: obstacle_layer,      type: "costmap_2d::ObstacleLayer"}
  # - {name: voxel_layer,         type: "costmap_2d::VoxelLayer"}
  - {name: rgbd_obstacle_layer, type: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"}
  # - {name: lidar_obstacle_layer, type: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"}
  - {name: inflation_layer,     type: "costmap_2d::InflationLayer"}

  # 25.10.14
  static_layer:
    enabled: true

  obstacle_layer:
    enabled: true
    obstacle_range: 4.0 # 用于障碍物探测，比如: 值为 3.0，意味着检测到距离小于 3 米的障碍物时，就会引入代价地图
    raytrace_range: 4.5 # 用于清除障碍物，比如：值为 3.5，意味着清除代价地图中 3.5 米以外的障碍物
    
    # 25.09.25 [BDS]
    observation_sources: scan
    # observation_sources: scan scan_depth
    scan:
      data_type: LaserScan 
      topic: /scan_cloud 
      marking: true 
      clearing: true
      sensor_frame: body
      # observation_persistence: 0.0

    # # Realsense 설정 : Pointcloud2laser
    # scan_depth:
    #   data_type: LaserScan
    #   topic: /scan_depth
    #   # topic: /scan_filtered
    #   marking: true
    #   clearing: true
    #   sensor_frame: body
    #   # observation_persistence: 0.0

  # voxel_layer:
  #   enabled: true
  #   # global_frame 기준 파라미터들 (sensor_frame X)
  #   origin_z: 0.0 # 전역 프레임의 바닥 높이 z
  #   z_resolution: 0.05 # z 방향 voxel 크기 (5cm 단위)
  #   # TODO : 8 ~ 12
  #   z_voxels: 8 # 총 높이 커버: 0.05 * 8 = 0.4m로 0.0 ~ 0.4m 관찰
  #   # TODO : 3 ~ 5
  #   unknown_threshold: 5        # voxel이 몇 개 이상 비어 있으면 clearing 허용
  #   mark_threshold: 3            # voxel이 몇 개 이상 채워지면 mark # fix
  #   publish_voxel_map: true     # rviz 시각화용. 필요하면 true
  #   # 여러 센서 데이터가 같은 costmap cell을 업데이트할 때 방법
  #   # 1 설정 시, 기존 값과 새 값 중 더 큰 값 사용 → 충돌 방지, 안정적
  #   combination_method: 1        # 0: overwrite, 1: max (기본값 추천)

